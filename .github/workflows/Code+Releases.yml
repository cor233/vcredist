name: 同步(Code + Releases)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: 检出目标仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: 添加源仓库为上游（支持 Token）
        run: |
          if [ -n "${{ secrets.SOURCE_REPO_TOKEN }}" ]; then
            git remote add upstream https://${{ secrets.SOURCE_REPO_TOKEN }}@github.com/abbodi1406/vcredist.git
          else
            git remote add upstream https://github.com/abbodi1406/vcredist.git
          fi
      - name: 从源仓库获取所有分支和标签
        run: |
          git fetch upstream --tags --force
      - name: 推送所有分支和标签到目标仓库
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --force --all "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force --tags "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
  sync-releases:
    runs-on: ubuntu-latest
    needs: sync-code
    steps:
      - name: 检出目标仓库
        uses: actions/checkout@v4
      - name: 获取并排序源仓库的所有 Releases
        id: get_releases
        run: |
          SOURCE_REPO="abbodi1406/vcredist"
          PAGE=1
          PER_PAGE=100
          RELEASES_JSON=""
          while true; do
            API_URL="https://api.github.com/repos/${SOURCE_REPO}/releases?per_page=${PER_PAGE}&page=${PAGE}"
            if [ -n "${{ secrets.SOURCE_REPO_TOKEN }}" ]; then
              RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.SOURCE_REPO_TOKEN }}" -H "Accept: application/vnd.github.v3+json" "$API_URL")
            else
              RESPONSE=$(curl -s -H "Accept: application/vnd.github.v3+json" "$API_URL")
            fi
            if ! echo "$RESPONSE" | jq -e 'type == "array"' > /dev/null; then
              echo "错误：API 响应不是数组，可能已达到速率限制或仓库不可访问。"
              echo "响应内容：$RESPONSE"
              exit 1
            fi
            if [ "$(echo "$RESPONSE" | jq length)" -eq 0 ]; then
              break
            fi
            if [ -z "$RELEASES_JSON" ]; then
              RELEASES_JSON="$RESPONSE"
            else
              RELEASES_JSON=$(echo "$RELEASES_JSON" "$RESPONSE" | jq -s 'add')
            fi
            PAGE=$((PAGE + 1))
          done
          RELEASES_JSON=$(echo "$RELEASES_JSON" | jq 'sort_by(.published_at)')
          echo "$RELEASES_JSON" > releases.json
      - name: 按顺序处理每个 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE_REPO="abbodi1406/vcredist"
          TARGET_REPO="${{ github.repository }}"
          jq -r '.[] | @base64' releases.json | while read release_b64; do
            release=$(echo "$release_b64" | base64 --decode)
            TAG_NAME=$(echo "$release" | jq -r '.tag_name')
            BODY=$(echo "$release" | jq -r '.body // ""')
            echo "正在处理 Release: $TAG_NAME"
            if gh release view "$TAG_NAME" --repo "$TARGET_REPO" &>/dev/null; then
              echo "Release $TAG_NAME 已存在，跳过。"
              continue
            fi
            echo "$BODY" > body.txt
            gh release create "$TAG_NAME" \
              --repo "$TARGET_REPO" \
              --title "$TAG_NAME" \
              --notes-file body.txt
            ASSET_URLS=$(echo "$release" | jq -r '.assets[]?.browser_download_url')
            if [ -n "$ASSET_URLS" ]; then
              mkdir -p "assets_$TAG_NAME"
              cd "assets_$TAG_NAME"
              echo "$ASSET_URLS" | while read url; do
                if [ -n "$url" ]; then
                  curl -s -L -O "$url"
                fi
              done
              for file in *; do
                if [ -f "$file" ]; then
                  gh release upload "$TAG_NAME" "$file" --repo "$TARGET_REPO" --clobber
                fi
              done
              cd ..
              rm -rf "assets_$TAG_NAME"
            fi
            rm -f body.txt
          done
